<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - EduTrack2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-950: #0A1B33;
            --navy-800: #13315C;
            --navy-700: #1D4076;
            --gold: #C9A227;
            --gold-light: #E4C766;
            --paper: #EDE1D3;
            --card: #FBF7F0;
            --ink: #1B2430;
            --muted: #6B7280;
            --error: #B3261E;
            --success: #2E7D46;
            --hairline: rgba(10, 27, 51, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: var(--paper);
        }

        /* ---------- Top bar ---------- */
        .topbar {
            background: linear-gradient(160deg, var(--navy-950), var(--navy-800));
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 14px rgba(10,27,51,0.25);
        }

        .wordmark {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.01em;
            color: #FBF7F0;
            margin: 0;
        }

        .wordmark span { color: var(--gold); }

        .user-block {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .greeting {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: rgba(251, 247, 240, 0.85);
        }

        .greeting strong {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #fff;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(160deg, var(--gold-light), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: var(--navy-950);
        }

        a.logout {
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(251, 247, 240, 0.75);
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid rgba(251, 247, 240, 0.3);
            border-radius: 999px;
            transition: all 0.15s ease;
        }

        a.logout:hover {
            color: var(--navy-950);
            background: var(--gold);
            border-color: var(--gold);
        }

        /* ---------- Main ---------- */
        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 48px 32px 60px;
        }

        .intro {
            text-align: center;
            margin-bottom: 40px;
        }

        .intro h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--navy-950);
            margin: 0 0 8px;
        }

        .intro p {
            font-size: 14px;
            color: var(--muted);
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .card {
            position: relative;
            background: var(--card);
            border: 1px solid var(--hairline);
            border-radius: 20px;
            padding: 30px 20px 26px;
            text-align: center;
            text-decoration: none;
            color: var(--ink);
            box-shadow: 0 1px 2px rgba(10,27,51,0.05), 0 16px 32px -18px rgba(10,27,51,0.25);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--gold-light));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
            box-shadow: 0 1px 2px rgba(10,27,51,0.06), 0 24px 40px -18px rgba(10,27,51,0.35);
        }

        .card:hover::before { transform: scaleX(1); }

        .icon-wrap {
            width: 54px;
            height: 54px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: linear-gradient(160deg, var(--navy-800), var(--navy-950));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .card .label {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 15px;
            color: var(--navy-950);
            margin-bottom: 4px;
        }

        .card .sub {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 820px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 560px) {
            .topbar { padding: 18px 20px; flex-wrap: wrap; gap: 12px; }
            main { padding: 36px 20px 48px; }
            .greeting { display: none; }
            .grid { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .card::before, a.logout { transition: none; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <p class="wordmark">Edu<span>Track2</span></p>
        <div class="user-block">
            <div class="avatar" th:text="${#strings.substring(username,0,1)}">S</div>
            <span class="greeting">Welcome back, <strong th:text="${username}">Student</strong></span>
            <a class="logout" href="/logout">Logout</a>
        </div>
    </div>

    <main>
        <div class="intro">
            <h1>Your Dashboard</h1>
            <p>Track your tests, activities, and progress all in one place.</p>
        </div>

        <div class="grid">
            <a class="card" href="/test-series">
                <div class="icon-wrap">📝</div>
                <span class="label">Test Series</span>
                <span class="sub">Attempt &amp; review exams</span>
            </a>
            <a class="card" href="/activities">
                <div class="icon-wrap">📚</div>
                <span class="label">Activities</span>
                <span class="sub">Assignments &amp; tasks</span>
            </a>
            <a class="card" href="/notifications">
                <div class="icon-wrap">🔔</div>
                <span class="label">Notifications</span>
                <span class="sub">Updates &amp; alerts</span>
            </a>
            <a class="card" href="/performance">
                <div class="icon-wrap">📊</div>
                <span class="label">Performance</span>
                <span class="sub">Scores &amp; analytics</span>
            </a>
        </div>
    </main>
</body>
</html>
