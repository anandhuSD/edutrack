<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Result - EduTrack2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-950: #0A1B33;
            --navy-800: #13315C;
            --navy-700: #1D4076;
            --gold: #C9A227;
            --gold-light: #E4C766;
            --paper: #EDE1D3;
            --card: #FBF7F0;
            --ink: #1B2430;
            --muted: #6B7280;
            --error: #B3261E;
            --success: #2E7D46;
            --hairline: rgba(10, 27, 51, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 20px;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: var(--paper);
        }

        .result-shell {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 1px 2px rgba(10,27,51,0.06), 0 30px 60px -24px rgba(10,27,51,0.35);
            padding: 44px 40px 36px;
            text-align: center;
        }

        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 8px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: var(--navy-950);
            margin: 0 0 30px;
        }

        .score-ring {
            width: 168px;
            height: 168px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: linear-gradient(160deg, var(--navy-950), var(--navy-800));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 16px 32px -14px rgba(10,27,51,0.5);
        }

        .score-ring::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            border: 2px solid rgba(228, 199, 102, 0.4);
        }

        .score-value {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 2.2rem;
            color: #fff;
            line-height: 1;
        }

        .score-value .sep {
            color: var(--gold-light);
            margin: 0 4px;
            font-size: 1.4rem;
        }

        .score-value .total {
            color: rgba(251, 247, 240, 0.6);
            font-size: 1.4rem;
        }

        .score-label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(251, 247, 240, 0.65);
            margin-top: 6px;
        }

        .percent-badge {
            display: inline-block;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 13px;
            color: var(--navy-800);
            background: rgba(201, 162, 39, 0.14);
            border: 1px solid rgba(201, 162, 39, 0.35);
            border-radius: 999px;
            padding: 7px 18px;
            margin-bottom: 30px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-700);
            text-decoration: none;
        }

        .back-link:hover { color: var(--gold); }

        @media (max-width: 480px) {
            .result-shell { padding: 36px 26px 30px; }
            .score-ring { width: 148px; height: 148px; }
            .score-value { font-size: 1.9rem; }
        }
    </style>
</head>
<body>
    <div class="result-shell">
        <p class="eyebrow">Result</p>
        <h1 th:text="${test.testName}"></h1>

        <div class="score-ring">
            <div>
                <div class="score-value">
                    <span th:text="${score}"></span><span class="sep">/</span><span class="total" th:text="${total}"></span>
                </div>
                <div class="score-label">Score</div>
            </div>
        </div>

        <span class="percent-badge" th:text="${#numbers.formatDecimal((score * 100.0) / total, 1, 0)} + '% correct'"></span>

        <div>
            <a href="/test-series" class="back-link">← Back to Test Series</a>
        </div>
    </div>
</body>
</html>
