<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Performance - EduTrack2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-950: #0A1B33;
            --navy-800: #13315C;
            --navy-700: #1D4076;
            --gold: #C9A227;
            --gold-light: #E4C766;
            --paper: #EDE1D3;
            --card: #FBF7F0;
            --ink: #1B2430;
            --muted: #6B7280;
            --hairline: rgba(10, 27, 51, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: var(--paper);
        }

        .topbar {
            background: linear-gradient(160deg, var(--navy-950), var(--navy-800));
            padding: 22px 40px;
            box-shadow: 0 4px 14px rgba(10,27,51,0.25);
        }

        .wordmark {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.01em;
            color: #FBF7F0;
            margin: 0;
        }

        .wordmark span { color: var(--gold); }

        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 48px 24px 60px;
        }

        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 8px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--navy-950);
            margin: 0 0 24px;
        }

        .intro-card {
            display: flex;
            align-items: center;
            gap: 18px;
            background: var(--card);
            border: 1px solid var(--hairline);
            border-radius: 18px;
            padding: 24px 26px;
            box-shadow: 0 1px 2px rgba(10,27,51,0.05), 0 16px 32px -20px rgba(10,27,51,0.25);
            margin-bottom: 28px;
        }

        .intro-badge {
            flex: 0 0 auto;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(160deg, var(--navy-800), var(--navy-950));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .intro-text p {
            margin: 0;
            font-size: 14.5px;
            color: var(--ink);
        }

        .intro-text .greet {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: var(--navy-950);
        }

        .empty-state {
            background: var(--card);
            border: 1px dashed var(--hairline);
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-700);
            text-decoration: none;
        }

        .back-link:hover { color: var(--gold); }

        @media (max-width: 560px) {
            .topbar { padding: 18px 20px; }
            main { padding: 36px 18px 48px; }
            .intro-card { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <p class="wordmark">Edu<span>Track2</span></p>
    </div>

    <main>
        <p class="eyebrow">Performance</p>
        <h1>Your Performance</h1>

        <div class="intro-card">
            <div class="intro-badge">📊</div>
            <div class="intro-text">
                <p>Hello, <span class="greet" th:text="${username}"></span>. This is the Performance page.</p>
            </div>
        </div>

        <div class="empty-state">
            <p>No exam results yet. Complete a test to see your performance here.</p>
        </div>

        <a href="/dashboard" class="back-link">← Back to Dashboard</a>
    </main>
</body>
</html>
