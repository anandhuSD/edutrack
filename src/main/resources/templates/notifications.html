<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications - EduTrack2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-950: #0A1B33;
            --navy-800: #13315C;
            --navy-700: #1D4076;
            --gold: #C9A227;
            --gold-light: #E4C766;
            --paper: #EDE1D3;
            --card: #FBF7F0;
            --ink: #1B2430;
            --muted: #6B7280;
            --error: #B3261E;
            --success: #2E7D46;
            --hairline: rgba(10, 27, 51, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: var(--paper);
        }

        .topbar {
            background: linear-gradient(160deg, var(--navy-950), var(--navy-800));
            padding: 22px 40px;
            box-shadow: 0 4px 14px rgba(10,27,51,0.25);
        }

        .wordmark {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.01em;
            color: #FBF7F0;
            margin: 0;
        }

        .wordmark span { color: var(--gold); }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 60px;
        }

        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 8px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--navy-950);
            margin: 0 0 32px;
        }

        .empty-state {
            background: var(--card);
            border: 1px dashed var(--hairline);
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .notif-card {
            position: relative;
            display: flex;
            gap: 16px;
            background: var(--card);
            border: 1px solid var(--hairline);
            border-radius: 16px;
            padding: 18px 22px;
            box-shadow: 0 1px 2px rgba(10,27,51,0.05), 0 12px 24px -16px rgba(10,27,51,0.25);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .notif-card:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
            box-shadow: 0 1px 2px rgba(10,27,51,0.06), 0 18px 30px -16px rgba(10,27,51,0.32);
        }

        .notif-badge {
            flex: 0 0 auto;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(160deg, var(--navy-800), var(--navy-950));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .notif-text {
            min-width: 0;
        }

        .notif-title {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 15px;
            color: var(--navy-950);
        }

        .notif-message {
            margin: 5px 0 0;
            font-family: 'Inter', sans-serif;
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--muted);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 32px;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-700);
            text-decoration: none;
        }

        .back-link:hover { color: var(--gold); }

        @media (max-width: 560px) {
            .topbar { padding: 18px 20px; }
            main { padding: 36px 18px 48px; }
            .notif-card { padding: 16px; gap: 12px; }
            .notif-badge { width: 36px; height: 36px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <p class="wordmark">Edu<span>Track2</span></p>
    </div>

    <main>
        <p class="eyebrow">Notifications</p>
        <h1>Updates &amp; Alerts</h1>

        <div th:if="${notifications.isEmpty()}" class="empty-state">
            <p>No notifications yet.</p>
        </div>

        <div class="notif-list">
            <div class="notif-card" th:each="n : ${notifications}">
                <div class="notif-badge">🔔</div>
                <div class="notif-text">
                    <strong class="notif-title" th:text="${n.title}"></strong>
                    <p class="notif-message" th:text="${n.message}"></p>
                </div>
            </div>
        </div>

        <a href="/dashboard" class="back-link">← Back to Dashboard</a>
    </main>
</body>
</html>
