<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Tests - EduTrack2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-950: #0A1B33;
            --navy-800: #13315C;
            --navy-700: #1D4076;
            --gold: #C9A227;
            --gold-light: #E4C766;
            --paper: #EDE1D3;
            --card: #FBF7F0;
            --ink: #1B2430;
            --muted: #6B7280;
            --error: #B3261E;
            --success: #2E7D46;
            --hairline: rgba(10, 27, 51, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: var(--paper);
        }

        .topbar {
            background: linear-gradient(160deg, var(--navy-950), var(--navy-800));
            padding: 22px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 14px rgba(10,27,51,0.25);
        }

        .wordmark {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.01em;
            color: #FBF7F0;
            margin: 0;
        }

        .wordmark span { color: var(--gold); }

        .admin-tag {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--navy-950);
            background: var(--gold-light);
            padding: 5px 12px;
            border-radius: 999px;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 24px 60px;
        }

        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 8px;
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--navy-950);
            margin: 0;
        }

        .btn-new {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 13.5px;
            color: #fff;
            background: linear-gradient(180deg, var(--navy-700), var(--navy-950));
            border: none;
            border-radius: 999px;
            padding: 11px 22px;
            text-decoration: none;
            box-shadow: 0 10px 20px -10px rgba(10, 27, 51, 0.55);
            transition: filter 0.15s ease, transform 0.05s ease;
            white-space: nowrap;
        }

        .btn-new:hover { filter: brightness(1.08); }
        .btn-new:active { transform: translateY(1px); }

        .empty-state {
            background: var(--card);
            border: 1px dashed var(--hairline);
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .test-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .test-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background: var(--card);
            border: 1px solid var(--hairline);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 1px 2px rgba(10,27,51,0.05), 0 12px 24px -18px rgba(10,27,51,0.2);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .test-row:hover {
            border-color: var(--gold);
            box-shadow: 0 1px 2px rgba(10,27,51,0.06), 0 16px 28px -16px rgba(10,27,51,0.3);
        }

        .test-info {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .test-name {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 15px;
            color: var(--navy-950);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .test-meta {
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            color: var(--muted);
            white-space: nowrap;
        }

        .edit-link {
            flex: 0 0 auto;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--navy-800);
            text-decoration: none;
            padding: 7px 14px;
            border: 1px solid var(--hairline);
            border-radius: 999px;
            transition: all 0.15s ease;
        }

        .edit-link:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--navy-950);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 32px;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-700);
            text-decoration: none;
        }

        .back-link:hover { color: var(--gold); }

        @media (max-width: 560px) {
            .topbar { padding: 18px 20px; }
            main { padding: 36px 18px 48px; }
            .test-row { flex-wrap: wrap; }
            .test-meta { display: none; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <p class="wordmark">Edu<span>Track2</span></p>
        <span class="admin-tag">Admin</span>
    </div>

    <main>
        <p class="eyebrow">Admin · Exams</p>
        <div class="page-head">
            <h1>Test Series</h1>
            <a href="/admin/tests/new" class="btn-new">+ New Test</a>
        </div>

        <div th:if="${tests.isEmpty()}" class="empty-state">
            <p>No tests created yet. Click "New Test" to add one.</p>
        </div>

        <div class="test-list">
            <div class="test-row" th:each="t : ${tests}">
                <div class="test-info">
                    <span class="test-name" th:text="${t.testName}"></span>
                    <span class="test-meta" th:text="${t.questions.size()} + ' question(s)'"></span>
                </div>
                <a class="edit-link" th:href="@{'/admin/tests/' + ${t.id} + '/questions'}">Edit →</a>
            </div>
        </div>

        <a href="/admin/dashboard" class="back-link">← Back to Admin Dashboard</a>
    </main>
</body>
</html>
