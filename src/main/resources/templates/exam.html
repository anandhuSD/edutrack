<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exam - EduTrack2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-950: #0A1B33;
            --navy-800: #13315C;
            --navy-700: #1D4076;
            --gold: #C9A227;
            --gold-light: #E4C766;
            --paper: #EDE1D3;
            --card: #FBF7F0;
            --ink: #1B2430;
            --muted: #6B7280;
            --error: #B3261E;
            --success: #2E7D46;
            --hairline: rgba(10, 27, 51, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: var(--paper);
        }

        .topbar {
            background: linear-gradient(160deg, var(--navy-950), var(--navy-800));
            padding: 22px 40px;
            box-shadow: 0 4px 14px rgba(10,27,51,0.25);
        }

        .wordmark {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.01em;
            color: #FBF7F0;
            margin: 0;
        }

        .wordmark span { color: var(--gold); }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 8px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--navy-950);
            margin: 0 0 20px;
        }

        .ticket-divider {
            border: none;
            border-top: 1.5px dashed var(--hairline);
            margin: 0 0 32px;
        }

        .question-card {
            background: var(--card);
            border: 1px solid var(--hairline);
            border-radius: 16px;
            padding: 24px 26px;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px rgba(10,27,51,0.05), 0 12px 24px -18px rgba(10,27,51,0.2);
        }

        .q-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            height: 26px;
            padding: 0 6px;
            border-radius: 8px;
            background: linear-gradient(160deg, var(--navy-800), var(--navy-950));
            color: var(--gold-light);
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 12.5px;
            margin-right: 10px;
        }

        .q-text {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 15px;
            color: var(--navy-950);
            margin: 0 0 16px;
            display: flex;
            align-items: flex-start;
            gap: 4px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 1px solid var(--hairline);
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
            font-size: 14px;
        }

        .option:hover {
            border-color: var(--gold);
            background: rgba(201, 162, 39, 0.05);
        }

        .option input[type="radio"] {
            accent-color: var(--navy-800);
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
        }

        .option:has(input:checked) {
            border-color: var(--gold);
            background: rgba(201, 162, 39, 0.1);
        }

        .option span { line-height: 1.4; }

        .submit-bar {
            position: sticky;
            bottom: 0;
            padding: 20px 0 4px;
            background: linear-gradient(180deg, rgba(237,225,211,0), var(--paper) 30%);
        }

        button.btn {
            width: 100%;
            padding: 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(180deg, var(--navy-700), var(--navy-950));
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 20px -8px rgba(10, 27, 51, 0.55);
            transition: filter 0.15s ease, transform 0.05s ease;
        }

        button.btn:hover { filter: brightness(1.08); }
        button.btn:active { transform: translateY(1px); }
        button.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

        @media (max-width: 560px) {
            .topbar { padding: 18px 20px; }
            main { padding: 36px 18px 70px; }
            .question-card { padding: 20px 18px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <p class="wordmark">Edu<span>Track2</span></p>
    </div>

    <main>
        <p class="eyebrow">Exam</p>
        <h1 th:text="${test.testName}"></h1>
        <hr class="ticket-divider" />

        <form th:action="@{'/exam/' + ${test.id} + '/submit'}" method="post">
            <div class="question-card" th:each="q, iter : ${test.questions}">
                <p class="q-text">
                    <span class="q-number" th:text="${iter.index}+1"></span>
                    <span th:text="${q.questionText}"></span>
                </p>
                <div class="options">
                    <label class="option">
                        <input type="radio" th:name="'q_' + ${q.id}" value="A" required />
                        <span th:text="'A. ' + ${q.optionA}"></span>
                    </label>
                    <label class="option">
                        <input type="radio" th:name="'q_' + ${q.id}" value="B" />
                        <span th:text="'B. ' + ${q.optionB}"></span>
                    </label>
                    <label class="option">
                        <input type="radio" th:name="'q_' + ${q.id}" value="C" />
                        <span th:text="'C. ' + ${q.optionC}"></span>
                    </label>
                    <label class="option">
                        <input type="radio" th:name="'q_' + ${q.id}" value="D" />
                        <span th:text="'D. ' + ${q.optionD}"></span>
                    </label>
                </div>
            </div>

            <div class="submit-bar">
                <button type="submit" class="btn">Submit Exam</button>
            </div>
        </form>
    </main>
</body>
</html>
