<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test Series - EduTrack2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-950: #0A1B33;
            --navy-800: #13315C;
            --navy-700: #1D4076;
            --gold: #C9A227;
            --gold-light: #E4C766;
            --paper: #EDE1D3;
            --card: #FBF7F0;
            --ink: #1B2430;
            --muted: #6B7280;
            --error: #B3261E;
            --success: #2E7D46;
            --hairline: rgba(10, 27, 51, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background: var(--paper);
        }

        .topbar {
            background: linear-gradient(160deg, var(--navy-950), var(--navy-800));
            padding: 22px 40px;
            box-shadow: 0 4px 14px rgba(10,27,51,0.25);
        }

        .wordmark {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.01em;
            color: #FBF7F0;
            margin: 0;
        }

        .wordmark span { color: var(--gold); }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 60px;
        }

        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin: 0 0 8px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 26px;
            color: var(--navy-950);
            margin: 0 0 32px;
        }

        .empty-state {
            background: var(--card);
            border: 1px dashed var(--hairline);
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .test-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .test-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background: var(--card);
            border: 1px solid var(--hairline);
            border-radius: 16px;
            padding: 18px 22px;
            text-decoration: none;
            color: var(--ink);
            box-shadow: 0 1px 2px rgba(10,27,51,0.05), 0 12px 24px -16px rgba(10,27,51,0.25);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .test-card:hover {
            transform: translateY(-2px);
            border-color: var(--gold);
            box-shadow: 0 1px 2px rgba(10,27,51,0.06), 0 18px 30px -16px rgba(10,27,51,0.32);
        }

        .test-info {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .test-badge {
            flex: 0 0 auto;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(160deg, var(--navy-800), var(--navy-950));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .test-text {
            min-width: 0;
        }

        .test-name {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 15px;
            color: var(--navy-950);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .test-meta {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 2px;
        }

        .test-cta {
            flex: 0 0 auto;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 12.5px;
            letter-spacing: 0.03em;
            color: var(--navy-800);
            padding: 8px 16px;
            border: 1px solid var(--hairline);
            border-radius: 999px;
            transition: all 0.15s ease;
        }

        .test-card:hover .test-cta {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--navy-950);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 32px;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-700);
            text-decoration: none;
        }

        .back-link:hover { color: var(--gold); }

        @media (max-width: 560px) {
            .topbar { padding: 18px 20px; }
            main { padding: 36px 18px 48px; }
            .test-card { padding: 16px; }
            .test-meta { display: none; }
            .test-cta { display: none; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <p class="wordmark">Edu<span>Track2</span></p>
    </div>

    <main>
        <p class="eyebrow">Test Series</p>
        <h1>Available Tests</h1>

        <div th:if="${tests.isEmpty()}" class="empty-state">
            <p>No tests available yet. Check back soon.</p>
        </div>

        <div class="test-list">
            <a class="test-card" th:each="t : ${tests}" th:href="@{'/exam/' + ${t.id}}">
                <div class="test-info">
                    <div class="test-badge">📝</div>
                    <div class="test-text">
                        <span class="test-name" th:text="${t.testName}"></span>
                        <span class="test-meta" th:text="${t.questions.size()} + ' questions'"></span>
                    </div>
                </div>
                <span class="test-cta">Start →</span>
            </a>
        </div>

        <a href="/dashboard" class="back-link">← Back to Dashboard</a>
    </main>
</body>
</html>
